name: Pulumi Run

on:
  workflow_call:
    inputs:
      command:
        description: "Pulumi command to run (preview or up)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  run:
    name: Pulumi ${{ inputs.command }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pulumi/auth-actions@v1
        with:
          organization: rhoades-brown
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:rhoades-brown

      - name: Install and inject ESC environment variables
        id: esc
        uses: pulumi/esc-action@v1
        with:
          environment: "proxmox/home"

      - name: Connect to Tailscale
        if: steps.esc.conclusion == 'success'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ steps.esc.outputs.TS_OAUTH_CLIENT_ID }}
          audience: ${{ steps.esc.outputs.TS_AUDIENCE }}
          tags: tag:github-actions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "pulumi/package-lock.json"

      - name: Install dependencies
        working-directory: ./pulumi
        run: npm ci

      - uses: pulumi/actions@v6
        with:
          work-dir: ./pulumi
          command: ${{ inputs.command }}
          stack-name: rhoades-brown/proxmox-talos/dev
