name: Pulumi

on:
  push:
    branches:
      - main
    paths:
      - 'pulumi/**'
      - '.github/workflows/pulumi.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pulumi/**'
      - '.github/workflows/pulumi.yml'

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    name: Pulumi Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pulumi/package-lock.json'

      - name: Install dependencies
        working-directory: ./pulumi
        run: npm ci

      - uses: pulumi/auth-actions@v1
        with:
          organization: rhoades-brown
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:rhoades-brown

      - name: Install and inject ESC environment variables
        uses: pulumi/esc-action@v1
        with:
          environment: 'proxmox/home'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ ENV.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ ENV.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - uses: pulumi/actions@v6
        with:
          work-dir: ./pulumi
          command: preview
          stack-name: rhoades-brown/proxmox-talos/dev




  deploy:
    name: Pulumi Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pulumi/package-lock.json'

      - name: Install dependencies
        working-directory: ./pulumi
        run: npm ci

      - uses: pulumi/auth-actions@v1
        with:
          organization: rhoades-brown
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:rhoades-brown

      - uses: pulumi/actions@v6
        with:
          work-dir: ./pulumi
          command: up
          stack-name: rhoades-brown/proxmox-talos/dev

  lint:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pulumi/package-lock.json'

      - name: Install dependencies
        working-directory: ./pulumi
        run: npm ci

      - name: Build TypeScript
        working-directory: ./pulumi
        run: npx tsc --noEmit
