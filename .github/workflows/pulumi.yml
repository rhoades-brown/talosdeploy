name: Pulumi

on:
  push:
    branches:
      - main
    paths:
      - 'pulumi/**'
      - '.github/workflows/pulumi.yml'
      - '.github/workflows/pulumi-run.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pulumi/**'
      - '.github/workflows/pulumi.yml'
      - '.github/workflows/pulumi-run.yml'

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    name: Pulumi Preview
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pulumi-run.yml
    with:
      command: preview

  deploy:
    name: Pulumi Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pulumi-run.yml
    with:
      command: up

  lint:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pulumi/package-lock.json'

      - name: Install dependencies
        working-directory: ./pulumi
        run: npm ci

      - name: Build TypeScript
        working-directory: ./pulumi
        run: npx tsc --noEmit
